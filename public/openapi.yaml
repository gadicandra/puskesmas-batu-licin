  /api/media:
    get:
      tags: [Media]
      summary: Daftar berkas
      description: Bisa dibaca publik — situs perlu menampilkan gambarnya.
      security: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/where'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginasi'
                  - type: object
                    properties:
                      docs:
                        type: array
                        items: { $ref: '#/components/schemas/Media' }
    post:
      tags: [Media]
      summary: Unggah berkas
      description: |
        Perlu login. Kirim sebagai `multipart/form-data`, BUKAN JSON.
        Batas 5 MB; hanya gambar dan PDF. Field `alt` wajib.
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, _payload]
              properties:
                file: { type: string, format: binary }
                _payload:
                  type: string
                  description: 'JSON berisi field non-berkas, mis. `{"alt":"Petugas menimbang balita"}`.'
      responses:
        '201':
          description: Terunggah.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BalasanTulis'
                  - type: object
                    properties:
                      doc: { $ref: '#/components/schemas/Media' }
        '400':
          description: Berkas terlalu besar, tipe tidak didukung, atau `alt` kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '403': { $ref: '#/components/responses/Galat403' }

  /api/media/{id}:
    parameters:
