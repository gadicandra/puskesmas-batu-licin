      description: |
        Tanpa login, hanya artikel `_status = published` yang muncul — penyaringan
        itu dikerjakan access control di server, bukan oleh query Anda.
        Admin unit yang login melihat artikelnya sendiri; superadmin melihat semua.
      security: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/depth'
        - $ref: '#/components/parameters/where'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginasi'
                  - type: object
                    properties:
                      docs:
                        type: array
                        items: { $ref: '#/components/schemas/Artikel' }
    post:
      tags: [Konten publik]
      summary: Tulis artikel
      description: |
        Perlu login. Admin unit boleh membuat artikel, dan field `author`
        **dipaksa** ke dirinya sendiri oleh hook di server — mengirim `author`
        orang lain tidak berpengaruh.
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Artikel' }
      responses:
        '201':
          description: Dibuat.
          content:
            application/json:
              schema:
