    post:
      tags: [Autentikasi]
      summary: Perpanjang sesi
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      responses:
        '200':
          description: Token baru.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  refreshedToken: { type: string }
                  exp: { type: integer }
        '401': { $ref: '#/components/responses/Galat401' }

  /api/track:
    post:
      tags: [Statistik]
      summary: Catat kunjungan halaman
      description: |
        Route buatan sendiri (`src/app/api/track/route.ts`), bukan bawaan Payload.
        Dipanggil `PageViewTracker` pada setiap perpindahan halaman publik.

        Tidak menyimpan IP maupun cookie: User-Agent di-hash. Bot disaring,
        dibatasi 30 permintaan per menit per IP, dan path divalidasi.

        **Selalu menjawab `200`**, termasuk saat permintaannya diabaikan —
        beacon statistik tidak boleh membuat halaman terlihat gagal. Kolom
        `skipped` menjelaskan alasannya.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, examples: ['/artikel/pekan-imunisasi'] }
                referrer: { type: string }
      responses:
        '200':
          description: Diterima atau sengaja diabaikan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  skipped:
                    type: string
                    enum: [bot, rate-limit, invalid-path]
                    description: Hanya ada bila permintaannya tidak dicatat.
