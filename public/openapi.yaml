  /api/posyandu:
    get:
      tags: [Data layanan]
      summary: Daftar posyandu (bentuk kontrak API)
      description: |
        **Berbeda dari koleksi lain:** endpoint ini kustom (`src/lib/api/posyandu.ts`)
        dan mengembalikan bentuk kontrak `PosyanduKontrak`, **tanpa paginasi** dan
        tanpa parameter `limit`/`page`/`sort`/`depth`/`where`.

        - Tanpa `all`: hanya posyandu aktif, urut `urutan` lalu nama. Bisa dibaca publik.
        - `all=true`: termasuk yang nonaktif, **khusus superadmin**.
      security: []
      parameters:
        - name: all
          in: query
          required: false
          description: Sertakan posyandu nonaktif. Butuh login superadmin.
          schema: { type: string, enum: ['true'] }
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                required: [docs, totalDocs]
                properties:
                  docs:
                    type: array
                    items: { $ref: '#/components/schemas/PosyanduKontrak' }
                  totalDocs: { type: integer }
        '401':
          description: '`all=true` tanpa login.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PesanGalat' }
              example: { message: 'Parameter all=true hanya untuk superadmin yang sudah login.' }
        '403':
          description: '`all=true` oleh pengguna yang bukan superadmin.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PesanGalat' }
              example: { message: 'Parameter all=true hanya untuk superadmin yang sudah login.' }
    post:
      tags: [Data layanan]
      summary: Tambah posyandu
      description: |
        Hanya superadmin. Body memakai nama isian Payload (skema `Posyandu`),
        **bukan** bentuk kontrak. Setelah tersimpan, cache halaman `/posyandu` dan
        `/profil-puskesmas` langsung disegarkan.
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Posyandu' }
            example:
              nama: Posyandu Melati
              deskripsi: Informasi Detail Posyandu
              desa: Desa Batulicin
              jadwal:
                - { hari: senin, polaMinggu: Minggu ke-1, jamMulai: '08:00', jamSelesai: '11:00' }
      responses:
        '201':
          description: Dibuat.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BalasanTulis'
                  - type: object
                    properties:
                      doc: { $ref: '#/components/schemas/Posyandu' }
        '400':
          description: |
            Isian tidak lolos validasi, termasuk foto yang bukan JPG/PNG/WebP atau
            lebih dari 5 MB, dan aturan jam jadwal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                errors:
                  - name: ValidationError
                    message: 'The following field is invalid: Jadwal Kegiatan'
                    data:
                      collection: posyandu
                      errors:
                        - label: Jadwal Kegiatan
                          message: 'Jadwal ke-1: jam selesai (08:00) harus lebih besar dari jam mulai (11:00). Perbaiki salah satunya.'
                          path: jadwal
        '403': { $ref: '#/components/responses/Galat403' }

  /api/posyandu/{id}:
    parameters:
      - $ref: '#/components/parameters/idPath'
    get:
      tags: [Data layanan]
      summary: Satu posyandu (bentuk kontrak API)
      description: |
        Endpoint kustom, bentuk `PosyanduKontrak`. Tanpa login, posyandu nonaktif
        dijawab 404. `id` harus angka — `/api/posyandu/count` tetap endpoint
        bawaan Payload.
      security: []
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosyanduKontrak' }
        '404':
          description: Tidak ada, atau nonaktif dan pemanggil bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PesanGalat' }
              example: { message: Posyandu tidak ditemukan. }
    patch:
      tags: [Data layanan]
      summary: Ubah posyandu
      description: |
        **Gunakan `PATCH`, bukan `PUT`.** `PUT` pada alamat ini menjawab
        `404 Route not found`. Kirim hanya field yang berubah, memakai nama isian
        Payload (skema `Posyandu`). Untuk `jadwal`, kirim seluruh daftar (sertakan
        `id` baris yang dipertahankan). Cache situs publik langsung disegarkan.
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Posyandu' }
      responses:
        '200':
          description: Tersimpan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BalasanTulis'
                  - type: object
                    properties:
                      doc: { $ref: '#/components/schemas/Posyandu' }
        '400': { $ref: '#/components/responses/Galat400' }
        '403': { $ref: '#/components/responses/Galat403' }
        '404': { $ref: '#/components/responses/Galat404' }
    delete:
      tags: [Data layanan]
      summary: Hapus posyandu
