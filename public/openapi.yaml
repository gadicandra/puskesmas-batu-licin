  /api/users/login:
    post:
      tags: [Autentikasi]
      summary: Masuk
      description: |
        Berhasil = cookie `payload-token` dipasang (httpOnly) **dan** token
        dikembalikan di badan respons untuk pemanggil non-browser.

        Pesan gagal sengaja tidak membedakan "email salah" dan "kata sandi
        salah". Akun terkunci sementara setelah beberapa kali gagal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, examples: [Authentication Passed] }
                  token: { type: string }
                  exp: { type: integer, description: Waktu kedaluwarsa (epoch detik). }
                  user: { $ref: '#/components/schemas/Pengguna' }
        '401': { $ref: '#/components/responses/Galat401' }

  /api/users/logout:
    post:
      tags: [Autentikasi]
      summary: Keluar
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      responses:
        '200':
          description: Cookie sesi dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/users/me:
    get:
      tags: [Autentikasi]
      summary: Siapa yang sedang login
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      responses:
        '200':
          description: |
            Selalu 200. Bila belum login, `user` bernilai `null` — periksa
            isinya, jangan mengandalkan kode status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/Pengguna'
                      - type: 'null'
                  token: { type: [string, 'null'] }
                  exp: { type: [integer, 'null'] }

  /api/users/refresh-token:
    post:
      tags: [Autentikasi]
      summary: Perpanjang sesi
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      responses:
        '200':
          description: Token baru.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  refreshedToken: { type: string }
                  exp: { type: integer }
        '401': { $ref: '#/components/responses/Galat401' }

  /api/track:
    post:
      tags: [Statistik]
      summary: Catat kunjungan halaman
      description: |
        Route buatan sendiri (`src/app/api/track/route.ts`), bukan bawaan Payload.
        Dipanggil `PageViewTracker` pada setiap perpindahan halaman publik.

        Tidak menyimpan IP maupun cookie: User-Agent di-hash. Bot disaring,
        dibatasi 30 permintaan per menit per IP, dan path divalidasi.

        **Selalu menjawab `200`**, termasuk saat permintaannya diabaikan —
        beacon statistik tidak boleh membuat halaman terlihat gagal. Kolom
        `skipped` menjelaskan alasannya.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, examples: ['/artikel/pekan-imunisasi'] }
                referrer: { type: string }
      responses:
        '200':
          description: Diterima atau sengaja diabaikan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  skipped:
                    type: string
                    enum: [bot, rate-limit, invalid-path]
                    description: Hanya ada bila permintaannya tidak dicatat.
