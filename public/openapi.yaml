    delete:
      tags: [Media]
      summary: Hapus berkas
      description: Perlu login. Berkas yang masih dipakai artikel sebaiknya dicek dulu di sisi Anda.
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      responses:
