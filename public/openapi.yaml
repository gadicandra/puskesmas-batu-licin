  /api/users/login:
    post:
      tags: [Autentikasi]
      summary: Masuk
      description: |
        Berhasil = cookie `payload-token` dipasang (httpOnly) **dan** token
        dikembalikan di badan respons untuk pemanggil non-browser.

        Pesan gagal sengaja tidak membedakan "email salah" dan "kata sandi
        salah". Akun terkunci sementara setelah beberapa kali gagal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, examples: [Authentication Passed] }
                  token: { type: string }
                  exp: { type: integer, description: Waktu kedaluwarsa (epoch detik). }
                  user: { $ref: '#/components/schemas/Pengguna' }
        '401': { $ref: '#/components/responses/Galat401' }

  /api/users/logout:
    post:
      tags: [Autentikasi]
      summary: Keluar
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      responses:
        '200':
          description: Cookie sesi dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/users/me:
    get:
      tags: [Autentikasi]
      summary: Siapa yang sedang login
      security: [{ cookieAuth: [] }, { bearerJWT: [] }]
      responses:
        '200':
          description: |
            Selalu 200. Bila belum login, `user` bernilai `null` — periksa
            isinya, jangan mengandalkan kode status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/Pengguna'
                      - type: 'null'
                  token: { type: [string, 'null'] }
                  exp: { type: [integer, 'null'] }

