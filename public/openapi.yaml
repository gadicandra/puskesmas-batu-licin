    get:
      tags: [Media]
      summary: Daftar berkas
      description: Bisa dibaca publik — situs perlu menampilkan gambarnya.
      security: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/sort'
