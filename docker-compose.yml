services:
  db:
    image: postgres:16-alpine
    container_name: puskesmas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: puskesmas
    ports:
      # Host 5434 → container 5432 (host 5432/5433 sudah dipakai Postgres lain)
      - "5434:5432"
    volumes:
      - puskesmas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puskesmas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  puskesmas_pgdata:
