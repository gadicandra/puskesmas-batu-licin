# Lingkungan pengembangan lengkap: `docker compose up` menyalakan Postgres dan
# aplikasi sekaligus. Tidak perlu memasang Node, pnpm, atau Postgres di komputer.
#
#   docker compose up                 → db + app di http://localhost:3000
#   docker compose --profile seed up seed → isi database dengan data awal
#
# Lihat README.md bagian "Mulai cepat".

services:
  db:
    image: postgres:16-alpine
    container_name: puskesmas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-puskesmas}
    ports:
      # Host 5434 → container 5432 (host 5432/5433 sudah dipakai Postgres lain).
      # Port ini hanya untuk akses dari komputer Anda, mis. DBeaver/psql.
      - "${DB_PORT:-5434}:5432"
    volumes:
      - puskesmas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-puskesmas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Tidak ada `apk add` di command: `sharp` (pengolah gambar Payload)
    # menyertakan biner musl sendiri (@img/sharp-linuxmusl-x64), jadi
    # `libc6-compat` tidak diperlukan. Memasang paket saat container start
    # membuat setiap `docker compose up` bergantung pada CDN Alpine — cukup
    # sekali jaringan lambat, container tidak pernah siap.
    image: node:22-alpine
    container_name: puskesmas-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Di dalam jaringan Docker, Postgres dipanggil lewat nama service `db`
      # pada port aslinya (5432) — BUKAN localhost:5434 yang hanya berlaku
      # dari komputer host.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-puskesmas}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-rahasia-pengembangan-jangan-dipakai-di-produksi}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Penyimpanan berkas. Kosong = disk lokal (volume puskesmas_media di
      # bawah). Terisi = Cloudflare R2, dan volume itu tidak lagi terpakai.
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Di dalam container tidak ada TTY, jadi auto-push skema Payload akan
      # menggantung pada prompt "kolom ini dibuat atau diganti nama?" dan
      # berhenti separuh jalan tanpa pesan galat. Container memakai migrasi.
      PAYLOAD_DB_PUSH: "false"
      # Direktori build terpisah dari milik host (lihat next.config.ts), supaya
      # `pnpm build` di komputer dan build di container tidak berebut folder
      # yang sama.
      NEXT_DIST_DIR: .next-docker
      MEDIA_DIR: media-docker
      # Perubahan berkas dari host tidak selalu terdeteksi di dalam container
      # (terutama Docker Desktop di Windows/macOS). Polling membuat hot-reload
      # tetap jalan di semua sistem operasi.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      # Dua volume ini "menutupi" folder dari host. node_modules milik host
      # bisa berisi biner Linux/macOS/Windows yang tidak cocok dengan container,
      # dan .next milik host akan bentrok dengan build di dalam container.
      - puskesmas_node_modules:/app/node_modules
      - puskesmas_next:/app/.next-docker
      # Berkas unggahan disimpan di volume agar tidak hilang saat container dibuat ulang.
      - puskesmas_media:/app/media-docker
    # `--forceAcceptWarning` pada migrate: Payload menolak jalan tanpa konfirmasi
    # bila database pernah disentuh auto-push (mis. seseorang menjalankan
    # `pnpm dev` di komputernya lebih dulu). Tanpa TTY, pertanyaan itu
    # menggantung dan container tidak pernah siap.
    #
    # Jangan menaruh komentar "#" DI DALAM string command: YAML `>` menggabungkan
    # semuanya jadi satu baris, sehingga "#" akan mematikan seluruh perintah
    # sesudahnya.
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm payload migrate --forceAcceptWarning &&
             pnpm dev --hostname 0.0.0.0"

  # Pengisian data awal. Sengaja dipisah dengan `profiles` supaya TIDAK ikut
  # jalan pada `docker compose up` biasa — data yang sudah diisi staf tidak
  # boleh tertimpa tanpa sengaja.
  seed:
    image: node:22-alpine
    working_dir: /app
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-puskesmas}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-rahasia-pengembangan-jangan-dipakai-di-produksi}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@puskesmas.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-puskesmas123}
      NODE_ENV: development
      PAYLOAD_DB_PUSH: "false"
      MEDIA_DIR: media-docker
    volumes:
      - .:/app
      - puskesmas_node_modules:/app/node_modules
      - puskesmas_media:/app/media-docker
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm seed"

volumes:
  puskesmas_pgdata:
  puskesmas_node_modules:
  puskesmas_next:
  puskesmas_media:
